<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Your Tally Wrapped</title>
<style>
@font-face{font-family:"Newsreader";src:url(data:font/woff2;base64,__FONT__) format("woff2");font-display:block}
:root{--bg:#0e0e0d;--panel:#161615;--fg:#f1f1ee;--dim:#8a8a86;--line:#2a2a28;--orange:#e5874c;--green:#3fb987}
*{box-sizing:border-box;margin:0}
html,body{background:var(--bg)}
body{color:var(--fg);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased;min-height:100vh;display:flex;flex-direction:column}
button,select{font:inherit;color:inherit}
header{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:18px 28px;border-bottom:1px solid var(--line)}
header h1{font-size:17px;font-weight:600;letter-spacing:-.01em;margin-right:auto;display:flex;align-items:center;gap:10px}
header h1 canvas{width:28px;height:28px}
.seg{display:flex;border:1px solid var(--line);border-radius:9px;padding:2px;background:var(--panel)}
.seg button{border:0;background:none;padding:6px 14px;border-radius:7px;cursor:pointer;color:var(--dim)}
.seg button[aria-pressed=true]{background:#2c2c2a;color:var(--fg)}
.plans{display:flex;gap:10px;align-items:center;flex-wrap:wrap;color:var(--dim);font-size:13px}
.plans label{display:flex;gap:6px;align-items:center}
.plans select{background:var(--panel);border:1px solid var(--line);border-radius:7px;padding:5px 8px}
main{flex:1;display:flex;gap:22px;overflow-x:auto;padding:26px 28px 18px;scroll-snap-type:x mandatory;scroll-padding-inline:28px;align-items:flex-start}
figure{flex:none;scroll-snap-align:start;display:flex;flex-direction:column;gap:10px}
figure canvas{display:block;height:min(66vh,620px);width:auto;border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.45)}
figure.post canvas{height:auto;width:min(80vw,640px)}
figcaption{display:flex;gap:8px;align-items:center;color:var(--dim);font-size:12.5px}
figcaption span{margin-right:auto}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:6px 12px;cursor:pointer}
.btn:hover{border-color:#44443f}
.btn.primary{background:var(--fg);color:var(--bg);border-color:var(--fg);font-weight:600}
footer{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:16px 28px 22px;border-top:1px solid var(--line);color:var(--dim);font-size:13px}
footer .note{margin-right:auto}
footer code{color:var(--fg);background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:2px 7px;font:12.5px ui-monospace,"SF Mono",Menlo,Consolas,monospace}
#toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:9px 16px;border-radius:9px;font-weight:600;opacity:0;transition:opacity .2s;pointer-events:none}
#toast.on{opacity:1}
@media (max-width:640px){header,main,footer{padding-left:16px;padding-right:16px}main{scroll-padding-inline:16px}}
</style>
</head>
<body>
<header>
  <h1><canvas id="logo" width="56" height="56"></canvas>Your Tally Wrapped</h1>
  <div class="plans" id="plans"></div>
  <div class="seg" id="periods"></div>
</header>
<main id="strip"></main>
<footer>
  <div class="note">Built on your computer from your agents’ logs. Nothing was uploaded. No project names are shown.</div>
  <button class="btn" id="all">Download all</button>
  <button class="btn primary" id="x">Copy card &amp; post on X</button>
</footer>
<div id="toast"></div>
<script>
"use strict";
const DATA = /*__DATA__*/null;

// ---------- look ----------
const SANS = '-apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif';
const SERIF = '"Newsreader", Georgia, serif';
const MONO = 'ui-monospace, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace';
const C = { red: "#e5484d", hair: "#e6e6e3", paper: "#fbfbfa", ink: "#0e0e0d", orange: "#e5874c", green: "#3fb987", grey: "#a9a9a5", soft: "#d9d9d5", dim: "#3a3a37", muted: "#6b6b68" };
const TILE = { claude: C.orange, codex: C.paper, opencodeGo: C.green, opencodeZen: "#4e95f5", openai: "#9b7bea", grok: "#e5566f", cursor: "#2bb5c9", gemini: "#5b7cfa", other: "#d9b44a" };
const NAMES = { claude: "Claude", codex: "Codex", opencodeGo: "OpenCode Go", opencodeZen: "OpenCode Zen", openai: "OpenAI", grok: "Grok", cursor: "Cursor", gemini: "Gemini", other: "Other" };
const PLANS = {
  claude: [["none", "None", 0], ["Claude Pro", "Pro", 20], ["Claude Max 5x", "Max 5×", 100], ["Claude Max 20x", "Max 20×", 200], ["Claude Team", "Team", 30]],
  codex: [["none", "None", 0], ["ChatGPT Plus", "Plus", 20], ["ChatGPT Pro", "Pro", 200], ["ChatGPT Business", "Business", 30]],
  opencodeGo: [["none", "None", 0], ["Go", "Go", 10]],
};
const state = { period: DATA.defaultPeriod, plans: { claude: DATA.plans.claude || "none", codex: DATA.plans.codex || "none", opencodeGo: "Go" } };
try { const saved = JSON.parse(localStorage.getItem("tally-wrapped-plans") || "null"); if (saved) Object.assign(state.plans, saved); } catch {}

// ---------- numbers ----------
const money = (v) => v === 0 ? "$0.00" : v < 0.01 ? "<$0.01" : v >= 1000 ? "$" + Math.round(v) : "$" + v.toFixed(2);
const times = (m) => (m >= 10 ? m.toFixed(0) : m.toFixed(1)) + "×";
function tok(n) {
  const t = (v) => v >= 100 ? v.toFixed(0) : v >= 10 ? v.toFixed(1) : v.toFixed(2);
  return n >= 1e9 ? t(n / 1e9) + "B" : n >= 1e6 ? t(n / 1e6) + "M" : n >= 1e3 ? t(n / 1e3) + "K" : String(n);
}
const priceOf = (s) => { const p = (PLANS[s] || []).find((x) => x[0] === state.plans[s]); return p ? p[2] : 0; };
const hourName = (h) => h === 0 ? "midnight" : h === 12 ? "noon" : `${h % 12} ${h < 12 ? "am" : "pm"}`;

function stats() {
  const P = DATA.periods[state.period], share = P.seconds / (30 * 86400);
  let planCost = 0, covered = 0;
  const rows = [];
  for (const [s, v] of Object.entries(P.services)) {
    if (v.cost <= 0.005) continue;
    const price = priceOf(s);
    let x = null;
    if (price > 0) { planCost += price * share; covered += v.cost; x = v.cost / (price * share); }
    const plan = state.plans[s] && state.plans[s] !== "none" ? state.plans[s] : null;
    const name = s === "claude" ? (plan || "Claude") : s === "openai" ? "OpenAI API" : NAMES[s];
    let meta = money(v.cost);
    if (s === "codex" && plan) meta += " · " + plan;
    if (x != null) meta += " · " + times(x) + (s === "codex" ? "" : " value");
    else if (s === "openai") meta += " · pay as you go";
    rows.push({ s, cost: v.cost, x, name, meta });
  }
  rows.sort((a, b) => b.cost - a.cost);
  const api = Object.values(P.services).reduce((a, v) => a + v.cost, 0);
  const tokens = Object.values(P.services).reduce((a, v) => a + v.tokens, 0);
  const multiple = planCost > 0 ? covered / planCost : null;
  const end = new Date(DATA.generated), days = state.period === "24h" ? 1 : state.period === "7d" ? 7 : 30;
  const start = new Date(end.getFullYear(), end.getMonth(), end.getDate() - (days - 1));
  const md = (d) => d.toLocaleDateString("en-US", { month: "short", day: "numeric" });
  const range = days === 1 ? md(end) : start.getMonth() === end.getMonth() ? `${md(start)} – ${end.getDate()}` : `${md(start)} – ${md(end)}`;
  return {
    P, rows, api, tokens, planCost, multiple, range,
    money: api >= 100 ? "$" + Math.round(api) : money(api),
    unit: { "24h": "day", "7d": "week", "30d": "month" }[state.period],
    span: { "24h": "24 hours", "7d": "seven days", "30d": "30 days" }[state.period],
    persona: persona(P),
  };
}

function persona(P) {
  const hrs = P.hours, total = Math.max(hrs.reduce((a, b) => a + b, 0), 1e-12);
  const share = (a, b) => hrs.slice(a, b).reduce((x, y) => x + y, 0) / total;
  const night = share(0, 5), morning = share(5, 12), evening = share(18, 24);
  const wd = P.weekdays, weekend = (wd[0] + wd[6]) / Math.max(wd.reduce((a, b) => a + b, 0), 1e-12);
  let peak = 12; hrs.forEach((v, i) => { if (v > hrs[peak]) peak = i; });
  let name;
  if (state.period !== "24h" && weekend >= 0.45) name = "Weekender";
  else if (night >= 0.3) name = "Night Owl";
  else if ((morning < 0.05 || peak >= 22 || peak < 5) && evening + night >= 0.3) name = "Late Shift";
  else if (morning >= 0.4) name = "Early Bird";
  else name = "Day Shift";
  let s = morning < 0.005 ? "Not one prompt before noon. " : `${Math.round(morning * 100)}% of it before noon. `;
  s += "Peak at " + hourName(peak);
  s += night > 0.02 && peak !== 0 ? ", still going past midnight. " : ". ";
  if (state.period !== "24h" && P.peakBar) s += new Date(P.peakBar).toLocaleDateString("en-US", { weekday: "long" }) + " was your biggest day.";
  return { name, line: s.trim() };
}

function tokenWords(n) {
  if (n >= 1e9) return (n >= 1e10 ? (n / 1e9).toFixed(1) : (n / 1e9).toFixed(2)) + " billion";
  if (n >= 1e6) return (n >= 1e8 ? (n / 1e6).toFixed(0) : (n / 1e6).toFixed(1)) + " million";
  return tok(n);
}

function postText(st) {
  let t = `My ${st.unit} in AI coding: ${st.money} at API prices`;
  if (st.multiple) t += ` on ${money(st.planCost)} of plans (${times(st.multiple)})`;
  t += `. ${tok(st.tokens)} tokens, and apparently I'm ${st.persona.name === "Weekender" ? "a Weekender" : "on the " + st.persona.name}.`;
  return t + " Get yours: npx tally-menubar wrapped · https://github.com/PratikRai0101/tally";
}

// ---------- dithering ----------
const B4 = [[0, 8, 2, 10], [12, 4, 14, 6], [3, 11, 1, 9], [15, 7, 13, 5]];
const ch = (i, v) => { const q = Math.round(Math.max(0, Math.min(1, v)) * 255); return i === 0 ? `rgb(${q},0,0)` : i === 1 ? `rgb(0,${q},0)` : `rgb(0,0,${q})`; };

/** Paints intensities into a low-res mask (one channel per colour), then draws a square dot wherever a cell beats the Bayer threshold. */
function dots(ctx, x0, y0, w, h, cell, colors, paint, dot = 0.78) {
  const sw = Math.ceil(w / cell), sh = Math.ceil(h / cell), m = document.createElement("canvas");
  m.width = sw; m.height = sh;
  const mx = m.getContext("2d", { willReadFrequently: true });
  mx.fillStyle = "#000"; mx.fillRect(0, 0, sw, sh);
  mx.globalCompositeOperation = "lighten";
  mx.save(); mx.scale(1 / cell, 1 / cell); paint(mx); mx.restore();
  const d = mx.getImageData(0, 0, sw, sh).data, paths = [new Path2D(), new Path2D(), new Path2D()], z = cell * dot;
  for (let y = 0; y < sh; y++) for (let x = 0; x < sw; x++) {
    const i = (y * sw + x) * 4, r = d[i], g = d[i + 1], b = d[i + 2], v = Math.max(r, g, b) / 255;
    if (v < 0.04 || v <= (B4[y & 3][x & 3] + 0.5) / 16) continue;
    paths[r >= g && r >= b ? 0 : g >= b ? 1 : 2].rect(x0 + x * cell, y0 + y * cell, z, z);
  }
  paths.forEach((p, c) => { if (colors[c]) { ctx.fillStyle = colors[c]; ctx.fill(p); } });
}

function sphere(mx, i, x, y, r, lvl = 1) {
  const g = mx.createRadialGradient(x - r * 0.35, y - r * 0.4, 0, x, y, r);
  g.addColorStop(0, ch(i, 0.34 * lvl)); g.addColorStop(0.5, ch(i, 0.7 * lvl)); g.addColorStop(0.86, ch(i, lvl)); g.addColorStop(1, ch(i, 0));
  mx.fillStyle = g; mx.beginPath(); mx.arc(x, y, r, 0, 6.2832); mx.fill();
}

/** The Tally mascot: an 11×11 squircle of balls with two tall eyes cut out. */
function mascot(mx, cx, cy, S, colOf = () => 1, look = [0, 0]) {
  const c = S / 11;
  for (let y = 0; y < 11; y++) for (let x = 0; x < 11; x++) {
    const u = (x - 5) / 5.4, v = (y - 5) / 5.4;
    if (u ** 4 + v ** 4 <= 1) sphere(mx, colOf(x), cx + (x - 5) * c, cy + (y - 5) * c, c * 0.47);
  }
  const k = S / 320;
  mx.save(); mx.globalCompositeOperation = "source-over"; mx.fillStyle = "#000";
  for (const ex of [116, 204]) {
    const w = 40 * k, h = 98 * k;
    mx.beginPath(); mx.roundRect(cx + (ex - 160) * k + look[0] * k * 16 - w / 2, cy - 4 * k + look[1] * k * 12 - h / 2, w, h, w / 2); mx.fill();
  }
  mx.restore();
}

// ---------- type ----------
function setFont(ctx, weight, size, fam, track = 0) {
  ctx.font = `${weight} ${size}px ${fam}`;
  if ("letterSpacing" in ctx) ctx.letterSpacing = track + "px";
}
const heavy = (ctx, size) => setFont(ctx, 800, size, SANS, -size * 0.045);
function put(ctx, s, x, y, color, align = "left", base = "alphabetic") {
  ctx.textAlign = align; ctx.textBaseline = base; if (color) ctx.fillStyle = color; ctx.fillText(s, x, y);
}
function fitHeavy(ctx, lines, size, maxW) {
  heavy(ctx, size);
  const w = Math.max(...lines.map((l) => ctx.measureText(l).width));
  return w > maxW ? size * maxW / w : size;
}
function wrap(ctx, s, maxW) {
  const out = []; let cur = "";
  for (const w of s.split(" ")) { const t = cur ? cur + " " + w : w; if (cur && ctx.measureText(t).width > maxW) { out.push(cur); cur = w; } else cur = t; }
  if (cur) out.push(cur);
  return out;
}
/** Serif paragraph whose last line sits on `bottom`. Returns the top of its first line. */
function serif(ctx, s, x, bottom, size, maxW, color) {
  setFont(ctx, 400, size, SERIF, -size * 0.01);
  const lines = wrap(ctx, s, maxW), lh = size * 1.2;
  lines.forEach((l, i) => put(ctx, l, x, bottom - (lines.length - 1 - i) * lh, color));
  return bottom - (lines.length - 1) * lh - size * 0.75;
}
function mono(ctx, s, x, y, size, color, align = "left", alpha = 1) {
  setFont(ctx, 400, size, MONO, size * 0.08);
  ctx.globalAlpha = alpha; put(ctx, s.toUpperCase(), x, y, color, align); ctx.globalAlpha = 1;
}
/** Lines of the display face; `top` is the top of the first line's capitals. */
function display(ctx, lines, size, x, top, color, maxW = 920) {
  const sz = fitHeavy(ctx, lines, size, maxW);
  heavy(ctx, sz);
  lines.forEach((l, i) => put(ctx, l, x, top + sz * 0.73 + i * sz * 0.98, color));
  return sz;
}
function boxed(ctx, s, x, baseline, size, bg, fg) {
  heavy(ctx, size);
  const pad = size * 0.12, w = ctx.measureText(s).width;
  ctx.fillStyle = bg; ctx.fillRect(x, baseline - size * 0.86, w + pad * 2, size * 1.1);
  put(ctx, s, x + pad, baseline, fg);
  return w + pad * 2;
}
function sticker(ctx, s, x, y, bg, deg, maxW = 900) {
  heavy(ctx, 76);
  let size = 76;
  if (ctx.measureText(s).width + 60 > maxW) { size = 76 * (maxW - 60) / ctx.measureText(s).width; heavy(ctx, size); }
  const W = ctx.measureText(s).width + 60, H = size * 1.5;
  ctx.save(); ctx.translate(x + W / 2, y + H / 2); ctx.rotate(deg * Math.PI / 180);
  ctx.fillStyle = bg; ctx.fillRect(-W / 2, -H / 2, W, H);
  put(ctx, s, -W / 2 + 30, -H / 2 + size * 0.21 + size * 0.79, C.ink);
  ctx.restore();
}
function icon(ctx, x, y, s) {
  ctx.save();
  const g = ctx.createLinearGradient(0, y, 0, y + s); g.addColorStop(0, "#26262a"); g.addColorStop(1, "#141416");
  ctx.fillStyle = g; ctx.beginPath(); ctx.roundRect(x, y, s, s, s * 0.225); ctx.fill();
  const cols = [["#e2774f", 0.78], ["#e8e8ea", 0.52], ["#42c08d", 0.3]], cw = s * 0.17, gap = s * 0.085;
  const x0 = x + (s - 3 * cw - 2 * gap) / 2, h = s * 0.66, yb = y + s * 0.83, p = Math.max(1.6, s * 0.05);
  cols.forEach(([c, f], i) => {
    for (let yy = 0; yy + p <= h; yy += p) for (let xx = 0; xx + p * 0.7 <= cw; xx += p) {
      ctx.fillStyle = yy < h * f ? c : "rgba(255,255,255,.13)";
      ctx.fillRect(x0 + i * (cw + gap) + xx, yb - yy - p, p * 0.72, p * 0.72);
    }
  });
  ctx.restore();
}
function brand(ctx, x, y, size, color) {
  icon(ctx, x, y, size);
  setFont(ctx, 600, size * 0.6, SANS, -size * 0.012);
  put(ctx, "Tally", x + size * 1.32, y + size / 2, color, "left", "middle");
}
/** The install line, as a dark pill whose bottom-right corner is (xr, yb). */
function pill(ctx, s, xr, yb, size, bg, fg) {
  setFont(ctx, 500, size, MONO, 0);
  const w = ctx.measureText(s).width, ph = size * 0.6, pv = size * 0.5;
  ctx.fillStyle = bg; ctx.beginPath(); ctx.roundRect(xr - w - ph * 2, yb - size - pv * 2, w + ph * 2, size + pv * 2, size * 0.3); ctx.fill();
  put(ctx, s, xr - ph, yb - pv - size * 0.5, fg, "right", "middle");
}
function rankList(ctx, title, items, x, y, size, maxW, color) {
  mono(ctx, title, x, y + size * 0.6, size * 0.6, color, "left", 0.7);
  items.forEach((s, i) => {
    const base = y + size * 0.6 + size * 0.5 + size * 0.8 + i * size * 1.38;
    setFont(ctx, 700, size, SANS, -size * 0.025);
    ctx.globalAlpha = 0.55; put(ctx, String(i + 1), x, base, color); ctx.globalAlpha = 1;
    let sz = size; const w = ctx.measureText(s).width, room = maxW - size * 1.15;
    if (w > room) { sz = size * room / w; setFont(ctx, 700, sz, SANS, -sz * 0.025); }
    put(ctx, s, x + size * 1.15, base, color);
  });
}
function stat(ctx, k, v, x, y, size, maxW, color) {
  mono(ctx, k, x, y + size * 0.27, size * 0.27, color, "left", 0.7);
  const sz = fitHeavy(ctx, [v], size, maxW); heavy(ctx, sz);
  put(ctx, v, x, y + size * 0.27 + size * 0.18 + size * 0.8, color);
}
function art(ctx, x, y, w, h, cell) {
  ctx.fillStyle = C.ink; ctx.fillRect(x, y, w, h);
  dots(ctx, x, y, w, h, cell, [C.orange, C.paper, C.green], (m) => mascot(m, w / 2, h * 0.52, Math.min(w, h) * 0.8, (cx) => cx <= 3 ? 0 : cx <= 6 ? 1 : 2, [0.3, 0.1]));
}

// ---------- slides (1080 × 1920; the post card is 1200 × 630 drawn at 2×) ----------
const W = 1080, H = 1920;
const bg = (ctx, c, w = W, h = H) => { ctx.fillStyle = c; ctx.fillRect(0, 0, w, h); };

function intro(ctx, st) {
  bg(ctx, C.orange);
  dots(ctx, 0, 0, W, H, 6, [null, C.ink, null], (m) => mascot(m, 540, 760, 820, () => 1, [0, 0.5]));
  brand(ctx, 80, 80, 56, C.ink);
  mono(ctx, st.range, 1000, 117, 26, C.ink, "right");
  const top = serif(ctx, "Let’s see where it all went.", 80, 1800, 52, 920, C.ink);
  const lines = [`Your ${st.unit} in`, "AI coding."], sz = fitHeavy(ctx, lines, 176, 940);
  display(ctx, lines, sz, 80, top - 96 - sz * 0.73 - sz * 0.98, C.ink, 940);
}

function total(ctx, st) {
  bg(ctx, C.ink);
  const r = st.P, n = Math.max(1, r.bars.length), gap = n > 10 ? 6 : 26, bw = (920 - gap * (n - 1)) / n, mx = Math.max(...r.bars, 1e-12);
  dots(ctx, 0, 0, W, H, 5, [C.orange, C.dim, null], (m) => {
    setFont(m, 800, 360, SANS, -360 * 0.03);
    let size = 360; const w = m.measureText(st.money).width;
    if (w > 950) { size = 360 * 950 / w; setFont(m, 800, size, SANS, -size * 0.03); }
    const g = m.createLinearGradient(0, 690 - size * 0.72, 0, 690); g.addColorStop(0, ch(0, 0.55)); g.addColorStop(1, ch(0, 1));
    m.fillStyle = g; m.textBaseline = "alphabetic"; m.textAlign = "left"; m.fillText(st.money, 64, 690);
    r.bars.forEach((v, i) => {
      const h = v > 0 ? 24 + 300 * Math.sqrt(v / mx) : 6, x = 80 + i * (bw + gap);
      const gb = m.createLinearGradient(0, 1770 - h, 0, 1770); gb.addColorStop(0, ch(0, 0.5)); gb.addColorStop(1, ch(0, 1));
      m.fillStyle = gb; m.fillRect(x, 1770 - h, bw, h);
    });
  });
  mono(ctx, "Your agents ran up", 80, 222, 26, C.grey);
  display(ctx, ["of AI coding at", "API prices."], 104, 80, 770, C.paper);
  if (st.multiple) {
    sticker(ctx, `You paid ${money(st.planCost)}.`, 70, 1070, C.green, -4);
    sticker(ctx, `That’s ${times(st.multiple)} your money.`, 170, 1200, C.paper, 3);
  } else {
    sticker(ctx, `${tok(st.tokens)} tokens.`, 70, 1070, C.green, -4);
    sticker(ctx, `${r.sessions} sessions.`, 170, 1200, C.paper, 3);
  }
  r.barLabels.forEach((l, i) => { if (l) mono(ctx, l, 80 + i * (bw + gap) + bw / 2, 1812, 22, C.grey, "center"); });
}

function plans(ctx, st) {
  bg(ctx, C.green);
  display(ctx, ["Your top plans"], 150, 80, 225, C.ink);
  st.rows.slice(0, 4).forEach((r, i) => {
    const y = 560 + i * 246;
    heavy(ctx, 96); put(ctx, String(i + 1), 80, y + 130, C.ink);
    ctx.fillStyle = C.ink; ctx.fillRect(206, y, 190, 190);
    const n = [5, 4, 3, 2][i], p = 190 / n;
    dots(ctx, 206, y, 190, 190, 4, [TILE[r.s], null, null], (m) => { for (let a = 0; a < n; a++) for (let b = 0; b < n; b++) sphere(m, 0, p * (b + 0.5), p * (a + 0.5), p * 0.47); });
    const nsz = fitHeavy(ctx, [r.name], 62, 568); heavy(ctx, nsz); put(ctx, r.name, 432, y + 95, C.ink);
    setFont(ctx, 400, 28, MONO, 0);
    let msz = 28; const mw = ctx.measureText(r.meta).width; if (mw > 568) { msz = 28 * 568 / mw; setFont(ctx, 400, msz, MONO, 0); }
    ctx.globalAlpha = 0.75; put(ctx, r.meta, 432, y + 140, C.ink); ctx.globalAlpha = 1;
  });
  let note = "Nothing to see yet.";
  const top = st.rows[0];
  if (top && st.api > 0) {
    note = `${NAMES[top.s]} did ${Math.round(top.cost / st.api * 100)}% of the work.`;
    if (st.P.models[0]) note += ` Your top model was ${st.P.models[0].name}.`;
  }
  serif(ctx, note, 80, 1810, 62, 920, C.ink);
}

function tokens(ctx, st) {
  bg(ctx, C.paper);
  const copies = st.tokens / 780000, per = Math.max(1, Math.ceil(copies / 1600)), n = Math.max(1, Math.round(copies / per));
  const cols = n > 200 ? 44 : Math.max(6, Math.ceil(Math.sqrt(n * 1.3))), p = Math.min(120, 920 / cols);
  dots(ctx, 0, 0, W, H, 3, [C.orange, C.ink, null], (m) => {
    for (let i = 0; i < n; i++) sphere(m, i === 0 ? 0 : 1, 80 + (i % cols) * p + p / 2, 680 + Math.floor(i / cols) * p + p / 2, p * 0.42, 0.95);
  });
  const words = tokenWords(st.tokens), sz = fitHeavy(ctx, [words + "  "], 150, 900);
  boxed(ctx, words, 80, 180 + sz * 0.86, sz, C.orange, C.ink);
  heavy(ctx, sz); put(ctx, "tokens.", 80, 180 + sz * 0.86 + sz * 0.98, C.ink);
  mono(ctx, per === 1 ? "= one War and Peace" : `= ${per} copies of War and Peace`, 1000, 646, 22, C.muted, "right");
  setFont(ctx, 400, 22, MONO, 22 * 0.08);
  const kw = ctx.measureText((per === 1 ? "= one War and Peace" : `= ${per} copies of War and Peace`).toUpperCase()).width;
  ctx.fillStyle = C.orange; ctx.fillRect(1000 - kw - 28, 630, 16, 16);
  const round = copies >= 1000 ? Math.round(copies / 100) * 100 : copies >= 100 ? Math.round(copies / 10) * 10 : Math.round(copies);
  const amount = copies < 1.5 ? "about one copy" : `about ${round.toLocaleString("en-US")} copies`;
  serif(ctx, `That’s ${amount} of War and Peace, read and written in ${st.span}.`, 80, 1790, 56, 920, C.ink);
}

function hours(ctx, st) {
  bg(ctx, C.ink);
  const hrs = st.P.hours, mx = Math.max(...hrs, 1e-12), cx = 540, cy = 780;
  dots(ctx, 0, 0, W, H, 5, [C.orange, C.dim, null], (m) => {
    for (let h = 0; h < 24; h++) {
      const v = hrs[h], a = h / 24 * 2 * Math.PI - Math.PI / 2, len = v > 0 ? 50 + 270 * Math.sqrt(v / mx) : 14;
      for (let s = 0; s < len; s += 26) { const rr = 100 + s + 13; sphere(m, v > 0 ? 0 : 1, cx + Math.cos(a) * rr, cy + Math.sin(a) * rr, 11.5, v > 0 ? 0.55 + 0.45 * s / len : 0.8); }
    }
    mascot(m, cx, cy, 170, () => 1, [0.6, -0.3]);
  });
  mono(ctx, "Your coding hours", 80, 172, 26, C.grey);
  for (const [t, h] of [["Midnight", 0], ["6 am", 6], ["Noon", 12], ["6 pm", 18]]) {
    const a = h / 24 * 2 * Math.PI - Math.PI / 2, r = h % 12 === 0 ? 450 : 420;
    setFont(ctx, 400, 22, MONO, 22 * 0.08); put(ctx, t.toUpperCase(), cx + Math.cos(a) * r, cy + Math.sin(a) * r, C.grey, "center", "middle");
  }
  const p = st.persona, words = p.name.split(" ");
  const top = serif(ctx, p.line, 80, 1810, 52, 910, C.soft);
  const l1 = words.length > 1 ? ["The", words[0]] : ["The"], l2 = words.length > 1 ? words.slice(1).join(" ") : p.name;
  heavy(ctx, 168);
  const wl1 = ctx.measureText(l1.join(" ")).width + 30 + 168 * 0.24, wl2 = ctx.measureText(l2).width + 168 * 0.24;
  const sz = Math.min(168, 168 * 920 / Math.max(wl1, wl2));
  const b2 = top - 52, b1 = b2 - sz * 0.98;
  heavy(ctx, sz); put(ctx, "The", 80, b1, C.paper);
  if (l1.length > 1) boxed(ctx, l1[1], 80 + ctx.measureText("The").width + 30, b1, sz, C.orange, C.ink);
  boxed(ctx, l2, 80, b2, sz, C.orange, C.ink);
}

const KIND = { five_hour: "5-hour limit", seven_day: "weekly limit", seven_day_opus: "weekly Opus limit", seven_day_sonnet: "weekly Sonnet limit", daily: "daily limit", monthly: "monthly limit", limit: "usage limit" };
const kindName = (k) => KIND[k] || String(k).replace(/_/g, " ") + " limit";
function span(ms) {
  const m = Math.round(ms / 60000), d = Math.floor(m / 1440), h = Math.floor((m % 1440) / 60), mm = m % 60;
  return d ? `${d}\u00a0day${d > 1 ? "s" : ""}` + (h ? ` ${h}h` : "") : h ? `${h}h` + (mm ? `\u00a0${mm}m` : "") : `${mm}\u00a0min`;
}
const when = (t) => { const d = new Date(t); return d.toLocaleDateString("en-US", { weekday: "short", month: "short", day: "numeric" }) + " · " + d.toLocaleTimeString("en-US", { hour: "numeric", minute: "2-digit" }).toLowerCase(); };
const showLimits = (P) => P.limits.hits.length > 0 || (P.limits.closest && P.limits.closest.pct >= 80);

/** The lockouts slide: every time a plan refused you, and the case for a warning before the next one. */
function limits(ctx, st) {
  bg(ctx, C.paper);
  const L = st.P.limits, hits = L.hits, n = hits.length;
  mono(ctx, "Your limits", 80, 172, 26, C.muted);
  const big = n ? String(n) : Math.round(L.closest.pct) + "%";
  dots(ctx, 0, 0, W, H, 5, [C.red, C.ink, null], (m) => {
    setFont(m, 800, 520, SANS, -520 * 0.03);
    const bw = m.measureText(big).width;
    if (bw > 940) { const sz = 520 * 940 / bw; setFont(m, 800, sz, SANS, -sz * 0.03); }
    const g = m.createLinearGradient(0, 760 - 380, 0, 760); g.addColorStop(0, ch(0, 0.55)); g.addColorStop(1, ch(0, 1));
    m.fillStyle = g; m.textAlign = "left"; m.textBaseline = "alphabetic"; m.fillText(big, 60, 760);
  });
  display(ctx, n ? [n === 1 ? "time you hit" : "times you hit", "the wall."] : ["was your", "closest call."], 120, 80, 830, C.ink);
  // one row per plan and limit, most hits first
  const groups = new Map();
  for (const h of hits) {
    const k = h.svc + "|" + h.kind, g = groups.get(k) || { svc: h.svc, kind: h.kind, count: 0, last: 0 };
    g.count++; g.last = Math.max(g.last, h.t); groups.set(k, g);
  }
  const rows = n ? [...groups.values()].sort((a, b) => b.count - a.count || b.last - a.last) : [{ ...L.closest, count: 0, last: L.closest.t }];
  const shown = rows.slice(0, 3), y0 = 1130, rh = 76;
  shown.forEach((g, i) => {
    const y = y0 + i * rh;
    ctx.fillStyle = C.hair; ctx.fillRect(80, y - 50, 920, 2);
    mono(ctx, `${NAMES[g.svc] || g.svc} · ${kindName(g.kind)}`, 80, y, 26, C.ink);
    const right = n ? `${g.count}× · last ${new Date(g.last).toLocaleDateString("en-US", { month: "short", day: "numeric" })}` : when(g.t);
    mono(ctx, right, 1000, y, 24, C.muted, "right");
  });
  ctx.fillStyle = C.hair; ctx.fillRect(80, y0 + shown.length * rh - 50, 920, 2);
  const waited = hits.reduce((a, h) => a + (h.resetAt && h.resetAt > h.t ? h.resetAt - h.t : 0), 0);
  const label = n ? (waited ? `Locked out for up to ${span(waited)}.` : "Every one mid-task.") : "You never hit the wall. Yet.";
  sticker(ctx, label, 70, y0 + shown.length * rh + 30, n ? C.orange : C.green, -3);
  brand(ctx, 80, H - 80 - 56, 56, C.ink);
  pill(ctx, "npx tally-menubar", 1000, H - 80, 26, C.ink, C.paper);
  mono(ctx, "Mac menu bar app", 1000, H - 80 - 26 - 26 - 22, 22, C.ink, "right", 0.75);
  serif(ctx, "Tally sits in your menu bar and warns you at 80%, or as soon as you’re on pace to run out, so you can wrap up first.", 80, H - 215, 46, 920, C.ink);
}

function summary(ctx, st) {
  bg(ctx, C.orange);
  art(ctx, 80, 180, 920, 740, 5);
  rankList(ctx, "Top plans", st.rows.slice(0, 4).map((r) => r.name), 80, 990, 40, 440, C.ink);
  rankList(ctx, "Top models", st.P.models.map((m) => m.name), 560, 990, 40, 440, C.ink);
  stat(ctx, "At API prices", st.money, 80, 1360, 88, 440, C.ink);
  stat(ctx, "Value", st.multiple ? times(st.multiple) : "—", 560, 1360, 88, 440, C.ink);
  stat(ctx, "Tokens", tok(st.tokens), 80, 1528, 88, 440, C.ink);
  stat(ctx, "Shift", st.persona.name.split(" ")[0], 560, 1528, 88, 440, C.ink);
  brand(ctx, 80, H - 80 - 56, 56, C.ink);
  pill(ctx, "npx tally-menubar wrapped", 1000, H - 80, 26, C.ink, C.paper);
  mono(ctx, st.range, 1000, H - 80 - 26 - 26 - 22, 22, C.ink, "right", 0.75);
}

function post(ctx, st) {
  ctx.save(); ctx.scale(2, 2);
  bg(ctx, C.orange, 1200, 630);
  art(ctx, 40, 40, 550, 550, 4);
  stat(ctx, "At API prices", st.money, 640, 52, 70, 242, C.ink);
  stat(ctx, "Value", st.multiple ? times(st.multiple) : tok(st.tokens), 906, 52, 70, 242, C.ink);
  rankList(ctx, "Top plans", st.rows.slice(0, 4).map((r) => r.name), 640, 196, 22, 242, C.ink);
  rankList(ctx, "Top models", st.P.models.map((m) => m.name), 906, 196, 22, 242, C.ink);
  brand(ctx, 640, 630 - 44 - 34, 34, C.ink);
  pill(ctx, "npx tally-menubar wrapped", 1148, 630 - 44, 15, C.ink, C.paper);
  mono(ctx, `${st.range} · The ${st.persona.name}`, 1148, 630 - 44 - 15 - 15 - 14, 13, C.ink, "right", 0.75);
  ctx.restore();
}

const ALL = [["intro", intro], ["total", total], ["plans", plans], ["tokens", tokens], ["hours", hours], ["limits", limits], ["summary", summary], ["post", post]];
let SLIDES = ALL;

// ---------- page ----------
const strip = document.getElementById("strip"), toast = document.getElementById("toast");
let canvases = [];
function say(s) { toast.textContent = s; toast.classList.add("on"); clearTimeout(say.t); say.t = setTimeout(() => toast.classList.remove("on"), 2200); }
const blob = (cv) => new Promise((res) => cv.toBlob(res, "image/png"));
const fileName = (i) => `tally-${state.period}-${i === SLIDES.length - 1 ? "post" : (i + 1) + "-" + SLIDES[i][0]}.png`;

async function download(i) {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(await blob(canvases[i])); a.download = fileName(i); a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}
async function copy(i) {
  try { await navigator.clipboard.write([new ClipboardItem({ "image/png": blob(canvases[i]) })]); say("Copied"); return true; }
  catch { await download(i); say("This browser blocks copying here, so it was downloaded instead"); return false; }
}

function render() {
  const st = stats();
  SLIDES = ALL.filter(([name]) => name !== "limits" || showLimits(st.P));
  strip.innerHTML = ""; canvases = [];
  SLIDES.forEach(([name, draw], i) => {
    const isPost = name === "post", cv = document.createElement("canvas");
    cv.width = isPost ? 2400 : W; cv.height = isPost ? 1260 : H;
    draw(cv.getContext("2d"), st);
    const fig = document.createElement("figure"); if (isPost) fig.className = "post";
    const cap = document.createElement("figcaption");
    cap.innerHTML = `<span>${isPost ? "Card for X · 1200×630" : `Story ${i + 1} of ${SLIDES.length - 1}`}</span>`;
    const b1 = Object.assign(document.createElement("button"), { className: "btn", textContent: "Copy" }); b1.onclick = () => copy(i);
    const b2 = Object.assign(document.createElement("button"), { className: "btn", textContent: "Download" }); b2.onclick = () => download(i);
    cap.append(b1, b2); fig.append(cv, cap); strip.append(fig); canvases.push(cv);
  });
  render.st = st;
}

function controls() {
  const per = document.getElementById("periods");
  for (const [k, label] of [["24h", "24 hours"], ["7d", "7 days"], ["30d", "30 days"]]) {
    const b = Object.assign(document.createElement("button"), { textContent: label });
    b.setAttribute("aria-pressed", String(state.period === k));
    b.onclick = () => { state.period = k; per.querySelectorAll("button").forEach((x) => x.setAttribute("aria-pressed", String(x === b))); render(); };
    per.append(b);
  }
  const used = new Set(Object.values(DATA.periods).flatMap((p) => Object.keys(p.services)));
  const box = document.getElementById("plans");
  for (const s of ["claude", "codex", "opencodeGo"]) {
    if (!used.has(s)) continue;
    const lab = document.createElement("label"); lab.textContent = (s === "codex" ? "ChatGPT" : NAMES[s]) + " plan";
    const sel = document.createElement("select");
    for (const [id, label, price] of PLANS[s]) sel.append(new Option(price ? `${label} · $${price}` : label, id));
    sel.value = state.plans[s];
    sel.onchange = () => { state.plans[s] = sel.value; try { localStorage.setItem("tally-wrapped-plans", JSON.stringify(state.plans)); } catch {} render(); };
    lab.append(sel); box.append(lab);
  }
  document.getElementById("all").onclick = async () => {
    for (let i = 0; i < canvases.length; i++) { await download(i); await new Promise((r) => setTimeout(r, 350)); }
    say(`Downloaded ${canvases.length} images`);
  };
  document.getElementById("x").onclick = async () => {
    const copied = await copy(SLIDES.length - 1);
    window.open("https://x.com/intent/post?text=" + encodeURIComponent(postText(render.st)), "_blank");
    if (copied) say("Card copied: paste it into the post");
  };
  icon(document.getElementById("logo").getContext("2d"), 0, 0, 56);
}

document.fonts.load('400 52px "Newsreader"').then(() => { controls(); render(); });
</script>
</body>
</html>
